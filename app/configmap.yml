apiVersion: v1
kind: ConfigMap
metadata:
  name: landing-page
  labels:
    app.kubernetes.io/name: landing-page
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <meta name="description" content="A lightweight Kubernetes GitOps demo.">
      <title>Platform Demo</title>

      <style>
        :root {
          color-scheme: dark;
          --bg: #080d19;
          --panel: rgba(20, 30, 49, 0.8);
          --text: #edf3ff;
          --muted: #a6b5cf;
          --accent: #7c9cff;
          --green: #6ce9b5;
          --border: rgba(166, 181, 207, 0.16);
        }

        * {
          box-sizing: border-box;
        }

        body {
          margin: 0;
          min-height: 100vh;
          font-family: Inter, ui-sans-serif, system-ui, -apple-system,
                       BlinkMacSystemFont, "Segoe UI", sans-serif;
          color: var(--text);
          background:
            radial-gradient(ellipse at 10% 0%, #203164 0%, transparent 45%),
            radial-gradient(ellipse at 95% 65%, #123a3b 0%, transparent 40%),
            var(--bg);
          line-height: 1.6;
        }

        a {
          color: inherit;
        }

        .container {
          width: min(1080px, calc(100% - 48px));
