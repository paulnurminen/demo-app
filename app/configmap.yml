apiVersion: v1
kind: ConfigMap
metadata:
  name: landing-page
  labels:
    app.kubernetes.io/name: landing-page
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <meta name="description" content="A lightweight Kubernetes GitOps demo.">
      <title>Platform Demo</title>

      <style>
        :root {
          color-scheme: dark;
          --bg: #080d19;
          --panel: rgba(20, 30, 49, 0.8);
          --text: #edf3ff;
          --muted: #a6b5cf;
          --accent: #7c9cff;
          --green: #6ce9b5;
          --border: rgba(166, 181, 207, 0.16);
        }

        * {
          box-sizing: border-box;
        }

        body {
          margin: 0;
          min-height: 100vh;
          font-family: Inter, ui-sans-serif, system-ui, -apple-system,
                       BlinkMacSystemFont, "Segoe UI", sans-serif;
          color: var(--text);
          background:
            radial-gradient(ellipse at 10% 0%, #203164 0%, transparent 45%),
            radial-gradient(ellipse at 95% 65%, #123a3b 0%, transparent 40%),
            var(--bg);
          line-height: 1.6;
        }

        a {
          color: inherit;
        }

        .container {
          width: min(1080px, calc(100% - 48px));
          margin: 0 auto;
        }

        header {
          display: flex;
          justify-content: space-between;
          align-items: center;
          gap: 20px;
          padding: 30px 0;
          border-bottom: 1px solid var(--border);
        }

        .brand {
          font-size: 18px;
          font-weight: 750;
          letter-spacing: -0.5px;
          text-decoration: none;
        }

        .brand span {
          color: var(--accent);
        }

        .badge {
          display: inline-flex;
          align-items: center;
          gap: 8px;
          padding: 6px 12px;
          border: 1px solid var(--border);
          border-radius: 999px;
          font-size: 12px;
          color: var(--muted);
          background: rgba(8, 13, 25, 0.4);
        }

        .dot {
          width: 7px;
          height: 7px;
          border-radius: 50%;
          background: var(--green);
          box-shadow: 0 0 14px rgba(108, 233, 181, 0.55);
        }

        .hero {
          padding: 92px 0 60px;
          max-width: 820px;
        }

        .eyebrow {
          margin: 0 0 20px;
          color: var(--green);
          font-size: 12px;
          font-weight: 700;
          letter-spacing: 2px;
          text-transform: uppercase;
        }

        h1 {
          margin: 0;
          font-size: clamp(42px, 7vw, 76px);
          line-height: 1.08;
          letter-spacing: -3px;
        }

        h1 span {
          color: var(--accent);
        }

        .intro {
          max-width: 620px;
          margin: 26px 0 0;
          font-size: 18px;
          color: var(--muted);
        }

        .actions {
          display: flex;
          flex-wrap: wrap;
          gap: 12px;
          margin-top: 32px;
        }

        .button {
          display: inline-block;
          padding: 12px 20px;
          border-radius: 10px;
          font-size: 14px;
          font-weight: 650;
          text-decoration: none;
          border: 1px solid var(--border);
          transition: transform 150ms ease, background 150ms ease;
        }

        .button:hover {
          transform: translateY(-2px);
        }

        .button:focus-visible {
          outline: 3px solid var(--green);
          outline-offset: 4px;
        }

        .primary {
          background: var(--accent);
          color: #080d19;
          border-color: var(--accent);
        }

        .secondary {
          background: var(--panel);
        }

        .cards {
          display: grid;
          grid-template-columns: repeat(3, 1fr);
          gap: 18px;
          padding: 0 0 38px;
        }

        .card {
          padding: 26px;
          border: 1px solid var(--border);
          border-radius: 16px;
          background: var(--panel);
        }

        .number {
          color: var(--accent);
          font-size: 12px;
          font-weight: 750;
          letter-spacing: 1px;
        }

        .card h2 {
          margin: 14px 0 8px;
          font-size: 19px;
        }

        .card p {
          margin: 0;
          font-size: 14px;
          color: var(--muted);
        }

        .terminal {
          margin-bottom: 60px;
          overflow: hidden;
          border: 1px solid var(--border);
          border-radius: 16px;
          background: rgba(5, 10, 20, 0.8);
        }

        .terminal-header {
          padding: 12px 20px;
          color: var(--muted);
          font-size: 12px;
          border-bottom: 1px solid var(--border);
          background: rgba(255, 255, 255, 0.025);
        }

        pre {
          margin: 0;
          padding: 24px;
          overflow-x: auto;
          font-size: 13px;
          line-height: 1.9;
          color: #c7d4ed;
        }

        .prompt {
          color: var(--green);
        }

        footer {
          display: flex;
          justify-content: space-between;
          flex-wrap: wrap;
          gap: 10px;
          padding: 24px 0 32px;
          border-top: 1px solid var(--border);
          color: var(--muted);
          font-size: 12px;
        }

        @media (max-width: 700px) {
          .cards {
            grid-template-columns: 1fr;
          }

          .hero {
            padding-top: 60px;
          }

          h1 {
            letter-spacing: -2px;
          }

          header {
            flex-wrap: wrap;
          }
        }

        @media (prefers-reduced-motion: reduce) {
          .button {
            transition: none;
          }
        }
      </style>
    </head>

    <body>
      <div class="container">
        <header>
          <a class="brand" href="/">platform<span>/</span>demo</a>
          <span class="badge">
            <span class="dot" aria-hidden="true"></span>
            NGINX landing page
          </span>
        </header>

        <main>
          <section class="hero" aria-labelledby="hero-title">
            <p class="eyebrow">Kubernetes · Argo CD · NGINX</p>

            <h1 id="hero-title">
              From Git commit.<br>
              To <span>running platform.</span>
            </h1>

            <p class="intro">
              A small application with a clear deployment model.
              Versioned in Git, delivered by Argo CD, and served by NGINX.
              No image rebuild required.
            </p>

            <div class="actions">
              <a class="button primary" href="#architecture">
                Explore the architecture
              </a>
              <a class="button secondary"
                 href="https://argo-cd.readthedocs.io/"
                 target="_blank"
                 rel="noopener noreferrer">
                Argo CD documentation
              </a>
            </div>
          </section>

          <section id="architecture" class="cards"
                   aria-label="Application architecture">
            <article class="card">
              <span class="number">01 / SOURCE</span>
              <h2>Git is the source</h2>
              <p>
                Application manifests and page content live together.
                Review changes, commit, and push.
              </p>
            </article>

            <article class="card">
              <span class="number">02 / DELIVERY</span>
              <h2>Argo CD deploys</h2>
              <p>
                Declarative synchronization keeps the deployed resources
                aligned with the desired configuration.
              </p>
            </article>

            <article class="card">
              <span class="number">03 / RUNTIME</span>
              <h2>NGINX serves</h2>
              <p>
                A lightweight web server delivers this page directly
                from a mounted Kubernetes ConfigMap.
              </p>
            </article>
          </section>

          <section class="terminal" aria-label="Example deployment workflow">
            <div class="terminal-header">Example GitOps workflow</div>
            <pre><code><span class="prompt">$</span> git add apps/landing-page
    <span class="prompt">$</span> git commit -m "Update landing page"
    <span class="prompt">$</span> git push

    Git repository → Argo CD → Kubernetes → NGINX</code></pre>
          </section>
        </main>

        <footer>
          <span>Platform Demo / GitOps Lab</span>
          <span>Static page · No application backend</span>
        </footer>
      </div>
    </body>
    </html>
