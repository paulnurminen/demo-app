apiVersion: v1
kind: Service
metadata:
  name: landing-page
  labels:
    app.kubernetes.io/name: landing-page
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: landing-page
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
