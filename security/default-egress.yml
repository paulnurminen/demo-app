apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-egress
  namespace: landing-demo
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - {}
  enableDefaultDeny:
    ingress: false
    egress: true
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    - toFQDNs:
        - matchName: ifconfig.me
      toPorts:
        - ports:
            - port: "80"
